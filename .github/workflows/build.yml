name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential ccache
      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.37
      - name: Build APK
        shell: bash
        run: buildozer -v android debug 2>&1 | tee build.log
      - name: Show error summary
        if: failure()
        run: |
          grep -n -i -E "error|failed|exception" build.log | tail -n 25
          echo "-----"
          tail -n 25 build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: binance-scanner-apk
          path: bin/*.apk
